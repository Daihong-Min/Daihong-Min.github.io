website:
  title: "Daihong Min"
  site-url: "https://www.daihongmin.com"
  google-analytics: "G-GGF1CFL098"
  description: "Daihong Min is a Ph.D. candidate in Economics at UC Davis working on international economics, macroeconomics, and geoeconomics."
  favicon: favicon-dm.png
  open-graph: true
  twitter-card:
    card-style: summary
  image: profile-2026-10-20-840.jpg
  search: false
  page-footer:
    # Deployment replaces this signature with the month of the latest docs change.
    center: '© 2026 Daihong Min · <span lang="ko">민대홍</span> · Last updated October 2026'
    border: false
  navbar:
    background: light
    left: []
    right:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: cv.qmd
        text: CV

format:
  html:
    include-in-header: site-head.html
    theme:
      light: cosmo
      dark: darkly
    css:
      - styles.css
      - site-layout.css
      - cv-viewer.css
    toc: true
